<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض أعمالي - مصمم جرافيك & AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* لون ليلي فخم */
            color: #f8fafc;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 50px 20px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p.subtitle { color: #94a3b8; font-size: 1.1rem; }

        /* تنسيق معرض الصور */
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .portfolio-item {
            background: #1e293b;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .portfolio-item:hover { transform: translateY(-10px); }
        .portfolio-item img { width: 100%; height: auto; display: block; }
        .portfolio-item p { padding: 15px; margin: 0; font-weight: bold; }

        /* زر واتساب */
        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 40px 0;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
        }
        .btn-whatsapp:hover { background-color: #128c7e; transform: scale(1.05); }
    </style>
</head>
